<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Roteiro São Luís</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">São Luís · Maranhão</p>
      <h1 id="title">Explorar</h1>
    </div>
    <span class="pill" id="progress">0/10 avaliados</span>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
      <div class="carousel" id="carousel"></div>
    </section>

    <section id="view-list" class="view">
      <div class="filters" id="filters"></div>
      <div class="feed" id="list"></div>
      <p class="credits">Fotos: Wikimedia Commons, com licenças livres. Autor e licença de cada foto aparecem na tela de detalhes.</p>
    </section>

    <section id="view-rank" class="view">
      <div class="podium" id="podium"></div>
      <div class="rows" id="rank"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="map">
      <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg>Mapa
    </button>
    <button class="tab" data-view="list">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Lugares
    </button>
    <button class="tab" data-view="rank">
      <svg viewBox="0 0 24 24"><path d="M8 21h8m-4-4v4m-5-17h10v5a5 5 0 0 1-10 0V4Zm10 1h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Ranking
    </button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <article class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-hero" id="sheet-hero">
      <div class="grabber"></div>
      <button class="close" id="close" aria-label="Fechar">✕</button>
      <a class="photo-credit" id="sheet-credit" target="_blank" rel="noopener"></a>
    </div>
    <div class="sheet-body">
      <p class="eyebrow" id="sheet-cat"></p>
      <h2 id="sheet-name"></h2>
      <p class="muted" id="sheet-desc"></p>

      <div class="rate-box">
        <h3>Sua avaliação</h3>
        <div class="stars" id="stars"></div>
        <p class="hint" id="stars-hint">Toque nas estrelas para avaliar</p>
      </div>

      <button class="vote" id="vote"></button>
      <a class="link" id="directions" target="_blank" rel="noopener">Como chegar →</a>
    </div>
  </article>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
