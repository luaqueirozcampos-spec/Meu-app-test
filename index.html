<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Roteiro São Luís</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">São Luís · MA</p>
      <h1 id="title">Explorar</h1>
    </div>
    <span class="pill" id="progress">0/10 avaliados</span>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
      <div class="chips" id="map-chips"></div>
    </section>

    <section id="view-list" class="view">
      <div class="list" id="list"></div>
    </section>

    <section id="view-rank" class="view">
      <div class="podium" id="podium"></div>
      <div class="list" id="rank"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="map"><span>🗺️</span>Mapa</button>
    <button class="tab" data-view="list"><span>📍</span>Lugares</button>
    <button class="tab" data-view="rank"><span>🏆</span>Ranking</button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <article class="sheet" id="sheet" aria-hidden="true">
    <div class="grabber"></div>
    <button class="close" id="close" aria-label="Fechar">✕</button>
    <div class="sheet-hero" id="sheet-hero"></div>
    <div class="sheet-body">
      <p class="eyebrow" id="sheet-cat"></p>
      <h2 id="sheet-name"></h2>
      <p class="muted" id="sheet-desc"></p>

      <h3>Sua avaliação</h3>
      <div class="stars" id="stars"></div>

      <button class="vote" id="vote"></button>
      <a class="link" id="directions" target="_blank" rel="noopener">Como chegar →</a>
    </div>
  </article>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
